<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANDALA LOVOL MONITORING</title>
<link rel="icon" href="https://drive.google.com/file/d/1QUSJ62NWM1Y0dpdwVxEEk46xWJ9_QIu5/view?usp=sharing">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #eee;
    overflow: hidden; /* Mencegah scroll ganda */
  }

  .iframe-container {
    width: 100%;
    height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
    overflow: hidden;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwPvlNFO0dPtJhl6oWx45zBvfHXOHHn992VIEYYyf0GbIa-IcEEqtj3r_T1JUMPLFRepQ/exec"
      scrolling="yes"
      allowfullscreen="true"
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;"
    ></iframe>
  </div>
</body>
</html>
